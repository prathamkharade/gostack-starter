# Hot reload for `make dev`: rebuilds templates, CSS and the binary on save.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go tool templ generate && ./bin/tailwindcss -i static/css/input.css -o static/css/app.css && go build -o ./tmp/app ./cmd/app"
  entrypoint = ["./tmp/app"]
  include_ext = ["go", "templ", "css", "js", "sql"]
  exclude_dir = ["tmp", "bin", "data", "e2e", "docs", "deploy", "static/vendor"]
  exclude_regex = ["_templ\\.go$", "_test\\.go$", "static/css/app\\.css$"]
  delay = 300
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
