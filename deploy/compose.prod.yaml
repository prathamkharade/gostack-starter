# Production stack for ONE small VPS (2 vCPU / 2-4 GB RAM is plenty to start).
#   Caddy (automatic HTTPS, HTTP/3, compression) -> app (web + worker) -> Postgres
# Usage on the server (in /opt/app):  docker compose -f compose.prod.yaml up -d
# Variables come from /opt/app/.env (never commit it).

name: app

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }   # logs cannot fill the disk

services:
  caddy:
    <<: *hardening
    image: caddy:2.11-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    mem_limit: 128m

  app:
    <<: *hardening
    image: ${APP_IMAGE:?set APP_IMAGE, e.g. ghcr.io/you/yourapp:latest}
    env_file: .env
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@db:5432/app?sslmode=disable
      TRUSTED_PROXIES: 172.16.0.0/12
    read_only: true                                  # immutable container
    tmpfs: ["/tmp:size=1g"]                          # media processing scratch space
    cap_drop: [ALL]
    volumes: ["media:/data/media"]
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 768m

  db:
    <<: *hardening
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: app
    command:
      - postgres
      - -c
      - shared_buffers=256MB          # ~25% of the RAM you give Postgres
      - -c
      - effective_cache_size=768MB
      - -c
      - max_connections=50
      - -c
      - work_mem=8MB
      - -c
      - random_page_cost=1.1          # SSD/NVMe
      - -c
      - log_min_duration_statement=500 # log slow queries (ms)
    volumes: ["pgdata:/var/lib/postgresql", "./backups:/backups"]
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 20
    mem_limit: 1g
    # no "ports": the database is reachable only inside the Docker network

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
